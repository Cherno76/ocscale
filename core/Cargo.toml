[package]
name = "ocscale-core"
version = "0.1.0"
edition = "2021"
description = "OCScale aggregation core: RawEvent extraction and Dashboard building, shared by the app and the multi-device sync server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
# SQLite for reading the OpenCode session database
rusqlite = { version = "0.31", features = ["bundled"] }
