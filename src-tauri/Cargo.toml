[package]
name = "ocscale"
version = "0.6.38"
description = "OpenCode token usage dashboard"
authors = ["you"]
edition = "2021"

[lib]
name = "ocscale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ocscale-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# decode the base64 PNG body of a screenshot data URL (see save_screenshot)
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
# SQLite for reading OpenCode session database
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# Liquid Glass backdrop (macOS 26+) / NSVisualEffectView fallback for the panel.
window-vibrancy = "0.8"
# Type for the WKWebView pointer handed to apply_liquid_glass.
objc2-app-kit = "0.3"
